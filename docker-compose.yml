# Xem docs/10-trien-khai-van-hanh.md §5 cho giải thích đầy đủ từng service. Cần 2 file .env riêng
# trước khi chạy `docker compose up`:
#   - ./.env            — biến compose-level (POSTGRES_*, NEXT_PUBLIC_*), copy từ .env.example
#   - ./backend/.env     — biến runtime CHO container backend/worker, copy từ backend/.env.example
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # KHÔNG publish cổng ra ngoài host — chỉ container trong cùng mạng compose truy cập được.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      RUN_JOBS: 'false' # API nhận traffic — KHÔNG chạy cron, tránh trùng khi scale nhiều replica
    depends_on:
      postgres: { condition: service_healthy }
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    expose: ['4000']
    # Scale khi cần: docker compose up --scale backend=3 — an toàn vì cron chỉ chạy ở service `worker`.

  # docs/12 OPS-01 — CÙNG image với `backend`, tách riêng CHỈ để chạy cron (dọn token hết hạn, backup
  # DB, dọn file mồ côi, nhắc lịch sinh nhật/kỷ niệm). KHÔNG expose port, KHÔNG nhận traffic, và LUÔN
  # giữ đúng 1 replica — 2 replica trở lên sẽ chạy backup/dọn file trùng lặp.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      RUN_JOBS: 'true'
    depends_on:
      postgres: { condition: service_healthy }
      backend: { condition: service_started } # chờ backend chạy migrate deploy xong trước
    command: node dist/server.js
    deploy:
      replicas: 1

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on: [backend]
    expose: ['3000']

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend, backend]

volumes:
  pgdata:
  caddy_data:
