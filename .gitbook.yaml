# Cấu hình đồng bộ GitHub → GitBook.
# GitBook chỉ đọc thư mục docs/gitbook/ (tài liệu dành cho khách hàng);
# toàn bộ tài liệu kỹ thuật trong docs/ KHÔNG được xuất bản.
#
# Cách kết nối: GitBook → Space → Integrations → GitHub → chọn repo và nhánh `main`.
# Mỗi lần merge vào main, GitBook tự cập nhật nội dung.

